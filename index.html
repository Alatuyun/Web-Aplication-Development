<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Shell</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar untuk menu navigasi -->
        <aside class="sidebar">
            <nav>...navigation menu...</nav>
        </aside>

        <!-- Topbar untuk judul halaman -->
        <header class="topbar">
            <h1>Dashboard</h1>
        </header>

        <!-- Area konten utama -->
        <main class="content">
            <!-- Section untuk kartu statistik -->
            <section class="stat-cards">
                <div class="stat-card">Total Users: -</div>
                <div class="stat-card">Total Transactions: -</div>
                <div class="stat-card">Average: -</div>
            </section>

            <!-- Section penanda lokasi chart (akan diisi pada Session 11) -->
            <section class="chart-placeholder">
                Chart will be displayed here (Session 11)
            </section>
        </main>
    </div>
</body>
</html>
